name: ci
on: [push, pull_request]
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Passing example must pass
        run: python3 scripts/preflight.py examples/passing-support-triage.yaml
      - name: Failing example must be blocked
        run: |
          if python3 scripts/preflight.py examples/failing-refunds-bot.yaml; then
            echo "expected the failing example to be blocked"; exit 1
          fi
      - name: Every check id must have a rationale
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          src = pathlib.Path("scripts/preflight.py").read_text()
          ids = set(re.findall(r'r\.add\((?:BLOCK|WARN),\s*"([a-z_]+\.[a-z_]+)"', src))
          rat = set(re.findall(r'^\s{4}"([a-z_]+\.[a-z_]+)":', src, re.M))
          missing = sorted(ids - rat)
          if missing:
              print("checks with no --explain rationale:", missing); sys.exit(1)
          print(f"all {len(ids)} check ids documented")
          PY

      - name: Action must block the failing example
        uses: ./
        id: act
        continue-on-error: true
        with:
          spec: examples/failing-refunds-bot.yaml
          comment-on-pr: "false"

      - name: Assert the action reported a block
        run: |
          if [ "${{ steps.act.outputs.passed }}" != "false" ]; then
            echo "action should have reported passed=false"; exit 1
          fi
          echo "action reported ${{ steps.act.outputs.blocking }} blocking findings"
