<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#0A0A0A"/>

  <!-- pass/fail mark, top-left, the identity's actual logo -->
  <text x="64" y="90" class="mono" font-size="22" letter-spacing="0.5">
    <tspan fill="#3DDC84">✓ PASSED</tspan>
    <tspan fill="#A1A1AA" dx="16">/</tspan>
    <tspan fill="#FF5C5C" dx="16">✗ BLOCKED</tspan>
  </text>

  <!-- headline -->
  <text x="64" y="180" class="head" font-size="56" fill="#FAFAFA" letter-spacing="-1">agent-preflight</text>

  <!-- subhead -->
  <text x="64" y="222" class="body" font-size="24" fill="#A1A1AA">Deterministic pre-deployment checks for AI agent systems.</text>

  <!-- terminal strip, real CLI output as the only decoration -->
  <rect x="64" y="256" width="1152" height="64" rx="8" fill="#141414" stroke="#27272A" stroke-width="1"/>
  <text x="88" y="296" class="mono" font-size="15">
    <tspan fill="#FF5C5C">x</tspan>
    <tspan fill="#FAFAFA" dx="10">[ops.liveness] no alert when a run silently never happens</tspan>
  </text>
</svg>
